name: Meta Apollo Grammar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Repository Grammar v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Meta Apollo repository grammar
        run: python DEV/scripts/validate_meta_apollo.py
